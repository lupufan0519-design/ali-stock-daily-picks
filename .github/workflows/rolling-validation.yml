name: Weekly rolling validation

on:
  schedule:
    # Friday 19:30 China Standard Time. Never runs on weekends.
    - cron: "30 11 * * 5"
  workflow_dispatch:
    inputs:
      bars:
        description: "Trading bars per stock"
        required: false
        default: "640"

permissions:
  contents: write

concurrency:
  group: stock-pages-daily
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Replay historical signals without future data
        env:
          INPUT_BARS: ${{ inputs.bars || '640' }}
        run: python rolling_validation.py --bars "$INPUT_BARS"
      - name: Persist validation evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results/rolling_validation.json
          if git diff --cached --quiet; then
            echo "Validation result unchanged"
          else
            git commit -m "Update rolling validation"
            git push origin main
          fi

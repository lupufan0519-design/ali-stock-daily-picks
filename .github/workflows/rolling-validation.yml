name: Weekly joint walk-forward validation

on:
  schedule:
    # Friday 19:30 China Standard Time. Never runs on weekends.
    - cron: "30 11 * * 5"
  workflow_dispatch:
    inputs:
      bars:
        description: "Trading bars per stock"
        required: false
        default: "1600"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-pages-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve the last completed trading day
        id: research
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("strategy/state.json").read_text(encoding="utf-8"))
          cutoff = str(state.get("last_trade_date", "")).strip()
          if not cutoff:
              raise SystemExit("strategy/state.json has no last_trade_date")
          previous_path = Path("results/strategy_grid_optimization.json")
          previous = {}
          if previous_path.exists():
              try:
                  previous = json.loads(previous_path.read_text(encoding="utf-8"))
              except (OSError, ValueError, TypeError):
                  previous = {}
          previous_cutoff = str(
              previous.get("meta", {}).get("completed_trade_date")
              or previous.get("completed_trade_date", "")
          ).strip()
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          should_run = manual or cutoff != previous_cutoff
          run_id = f"joint-{cutoff}-{os.environ['GITHUB_RUN_ID']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cutoff={cutoff}\n")
              output.write(f"run_id={run_id}\n")
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(
              f"Completed trading day: {cutoff}; previous={previous_cutoff or '-'}; "
              f"run={should_run}; run_id={run_id}"
          )
          PY
      - name: Install dependencies
        if: steps.research.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Jointly replay entry and exit rules without future data
        if: steps.research.outputs.run == 'true'
        env:
          INPUT_BARS: ${{ inputs.bars || '1600' }}
        run: >-
          python signal_window_optimization.py
          --bars "$INPUT_BARS"
          --completed-trade-date "${{ steps.research.outputs.cutoff }}"
          --run-id "${{ steps.research.outputs.run_id }}"
          --output results/strategy_grid_optimization.json
          --case-output results/trend_case.json
      - name: Validate the frozen strategy as a capacity-constrained portfolio
        if: steps.research.outputs.run == 'true'
        env:
          INPUT_BARS: ${{ inputs.bars || '1600' }}
        run: >-
          python strategy_portfolio_validation.py
          --candidates "low_risk_2__wave_erasure_hybrid_or_10_10_weakening,low_risk_2__wave_erasure_trail_10_10,low_risk_2__wave_erasure_hybrid_or_8_3_weakening,break_5day_high__trail_3_2"
          --bars "$INPUT_BARS"
          --completed-trade-date "${{ steps.research.outputs.cutoff }}"
          --output results/strategy_portfolio_validation.json
          --omit-trades
      - name: Verify frozen strategy identity before publishing
        if: steps.research.outputs.run == 'true'
        run: >-
          python validate_strategy_artifacts.py
          --grid results/strategy_grid_optimization.json
          --case results/trend_case.json
          --portfolio results/strategy_portfolio_validation.json
          --require-portfolio
      - name: Refresh the complete research section
        if: steps.research.outputs.run == 'true'
        run: python refresh_report_research.py
      - name: Refresh published closing quotes
        if: steps.research.outputs.run == 'true'
        run: python intraday.py --result cloud_snapshot.json
      - name: Build static site
        if: steps.research.outputs.run == 'true'
        run: python prepare_site.py
      - name: Persist joint validation evidence
        if: steps.research.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results/strategy_grid_optimization.json results/trend_case.json results/strategy_portfolio_validation.json results/latest.html index.html
          if git diff --cached --quiet; then
            echo "Validation result unchanged"
          else
            git commit -m "Update joint walk-forward validation ${{ steps.research.outputs.cutoff }}"
            git push origin main
          fi
      - uses: actions/configure-pages@v5
        if: steps.research.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.research.outputs.run == 'true'
        with:
          path: _site
      - name: Deploy GitHub Pages
        if: steps.research.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

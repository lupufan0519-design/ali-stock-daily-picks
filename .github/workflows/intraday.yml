name: Intraday market refresh

on:
  schedule:
    # China Standard Time: 09:15-11:30 and 13:00-15:00, weekdays only.
    # The trading-window step remains as a second guard for delayed GitHub runs.
    - cron: "15-55/5 1 * * 1-5"
    - cron: "*/5 2 * * 1-5"
    - cron: "0-30/5 3 * * 1-5"
    - cron: "*/5 5-6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run outside the Shanghai trading window"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-pages-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Check Shanghai trading window
        id: market
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          hhmm = now.strftime("%H:%M")
          trading = (
              now.weekday() < 5
              and (
                  "09:15" <= hhmm <= "11:30"
                  or "13:00" <= hhmm <= "15:00"
              )
          )
          force_run = os.environ.get("FORCE_RUN", "").lower() == "true"
          should_run = trading or (
              os.environ["EVENT_NAME"] == "workflow_dispatch" and force_run
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(
              f"Shanghai time {now:%Y-%m-%d %H:%M:%S}; "
              f"trading={trading}; run={should_run}"
          )
          PY

      - uses: actions/setup-python@v6
        if: steps.market.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.market.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Recalculate live pools and refresh quotes
        if: steps.market.outputs.run == 'true'
        run: python intraday.py --result cloud_snapshot.json
      - name: Build static site
        if: steps.market.outputs.run == 'true'
        run: python prepare_site.py
      - name: Publish static site branch
        if: steps.market.outputs.run == 'true'
        run: python publish_pages_branch.py --site _site

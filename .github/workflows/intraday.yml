name: Intraday market refresh

on:
  schedule:
    # China Standard Time: 09:30-11:30 and 13:00-15:00, weekdays only.
    # The trading-window step remains as a second guard for delayed GitHub runs.
    - cron: "30-55/5 1 * * 1-5"
    - cron: "*/5 2 * * 1-5"
    - cron: "0-30/5 3 * * 1-5"
    - cron: "*/5 5-6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Compatibility input; refresh still runs only while the market is open"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # A stale runner allocation must not block every later five-minute refresh
  # or the independent close settlement. Keep only the newest intraday run.
  group: stock-pages-intraday
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Check Shanghai trading window
        id: market
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          hhmm = now.strftime("%H:%M")
          trading = (
              now.weekday() < 5
              and (
                  "09:30" <= hhmm <= "11:30"
                  or "13:00" <= hhmm <= "15:00"
              )
          )
          should_run = trading
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(
              f"Shanghai time {now:%Y-%m-%d %H:%M:%S}; "
              f"trading={trading}; run={should_run}"
          )
          PY

      - name: Check that the exchange is trading today
        id: trading_day
        if: steps.market.outputs.run == 'true'
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from cloud_gate import fetch_tencent_trade_date

          today = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d")
          try:
              quote_date = fetch_tencent_trade_date()
          except Exception as exc:
              quote_date = ""
              print(f"Trading-day check unavailable: {type(exc).__name__}: {exc}")
          should_run = quote_date == today
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(f"today={today}; quote_date={quote_date or '-'}; run={should_run}")
          PY

      - uses: actions/setup-python@v6
        if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Recalculate live pools and refresh quotes
        if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
        run: python intraday.py --result cloud_snapshot.json
      - name: Build static site
        if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
        run: python prepare_site.py
      - name: Persist intraday selection transitions
        if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- results/history.json; then
            echo "No selection appearance or removal transition to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results/history.json
          git commit -m "Record intraday selection transitions"
          git push origin main
      - uses: actions/configure-pages@v5
        if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
        with:
          path: _site
      - name: Deploy GitHub Pages
        if: steps.market.outputs.run == 'true' && steps.trading_day.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

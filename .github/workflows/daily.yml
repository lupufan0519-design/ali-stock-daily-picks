name: Daily close screening

on:
  schedule:
    # 17:40 China Standard Time fallback. External triggers run at 15:40/16:40.
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the close/trading-day gate would skip"
        required: false
        type: boolean
        default: false
      bootstrap_live:
        description: "Build intraday seeds from the last settled close without changing tracking"
        required: false
        type: boolean
        default: false
      ui_only:
        description: "Rebuild and deploy the UI from the committed market snapshot"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-pages-publish
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Check completed trading day
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force || false }}
          BOOTSTRAP_LIVE: ${{ inputs.bootstrap_live || false }}
          UI_ONLY: ${{ inputs.ui_only || false }}
        run: |
          if [ "$FORCE_RUN" = "true" ] || [ "$BOOTSTRAP_LIVE" = "true" ] || [ "$UI_ONLY" = "true" ]; then
            python cloud_gate.py --force
          else
            python cloud_gate.py
          fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run full-market close screening
        if: steps.gate.outputs.run == 'true'
        id: screening
        env:
          BOOTSTRAP_LIVE: ${{ inputs.bootstrap_live || false }}
          FORCE_RUN: ${{ inputs.force || false }}
          UI_ONLY: ${{ inputs.ui_only || false }}
        run: |
          if [ "$UI_ONLY" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "trade_date=$(python -c 'import json; print(json.load(open("cloud_snapshot.json", encoding="utf-8"))["trade_date"])')" >> "$GITHUB_OUTPUT"
          elif [ "$BOOTSTRAP_LIVE" = "true" ]; then
            python cloud_daily.py --bootstrap-live
          else
            python cloud_daily.py
          fi
          if [ "$FORCE_RUN" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh closing quotes
        if: steps.screening.outputs.changed == 'true'
        run: python intraday.py --result cloud_snapshot.json
      - name: Rebuild report UI from current snapshot
        if: steps.screening.outputs.changed == 'true' && inputs.ui_only == true
        run: python rebuild_ui.py
      - name: Build static site
        if: steps.screening.outputs.changed == 'true'
        run: python prepare_site.py
      - name: Persist close state or live bootstrap
        if: steps.screening.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results/latest.html results/history.json index.html cloud_snapshot.json cache/universe.json cache/company_metadata.json
          git commit -m "Update daily report ${{ steps.screening.outputs.trade_date }}"
          git push origin main
      - if: steps.screening.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.screening.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        if: steps.screening.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

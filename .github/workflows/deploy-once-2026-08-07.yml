name: One-time sorted tier deployment

on:
  schedule:
    # 2026-08-07 09:00 China Standard Time. The gate makes later years no-ops.
    - cron: "0 1 7 8 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Enforce the one-time deployment date
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          should_run = (
              os.environ["EVENT_NAME"] == "workflow_dispatch"
              or now.strftime("%Y-%m-%d") == "2026-08-07"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(f"Shanghai time {now:%Y-%m-%d %H:%M:%S}; run={should_run}")
          PY

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Refresh prices and sorted tiers from the committed snapshot
        if: steps.gate.outputs.run == 'true'
        run: python intraday.py --result cloud_snapshot.json

      - name: Build static site
        if: steps.gate.outputs.run == 'true'
        run: python prepare_site.py

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: steps.gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
